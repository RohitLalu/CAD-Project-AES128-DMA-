# ========================================================================
# Power Delivery Network (PDN) Configuration for Sky130
# ========================================================================
# This defines the power grid structure
# ========================================================================

# ========================================================================
# Power/Ground Net Names
# ========================================================================
set ::power_nets "VPWR"
set ::ground_nets "VGND"

# ========================================================================
# Standard Cell Power Rails
# ========================================================================
# Standard cells connect to power via met1 rails
pdngen::specify_grid stdcell {
    name grid
    rails {
        met1 {width 0.48 pitch 2.72 offset 0}
    }
    straps {
        met4 {width 1.6 pitch 20.0 offset 2.0}
        met5 {width 1.6 pitch 20.0 offset 2.0}
    }
    connect {{met1 met4} {met4 met5}}
}

# ========================================================================
# Power Ring
# ========================================================================
# Create power ring around the core
pdngen::add_pdn_ring \
    -grid grid \
    -layers {met4 met5} \
    -widths {5.0 5.0} \
    -spacings {2.0 2.0} \
    -core_offsets {5.0 5.0}

# ========================================================================
# Power Pads (if using I/O pads)
# ========================================================================
# For now, we're just doing the core
# I/O pad connection will be added later if needed

# ========================================================================
# Notes
# ========================================================================
# - met1: Standard cell power rails (horizontal)
# - met4/met5: Power straps (vertical/horizontal grid)
# - Power ring: Surrounds core, distributes power from pads
# - Via connections ensure power flow between layers
